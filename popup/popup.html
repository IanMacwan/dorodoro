<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>dorodoro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="terminal">
    <div class="titlebar">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="titlebar-text">dorodoro@youtube:~</span>
    </div>

    <div class="term-body">
      <pre class="yt-ascii">
 ▌       ▌      
▛▌▛▌▛▘▛▌▛▌▛▌▛▘▛▌
▙▌▙▌▌ ▙▌▙▌▙▌▌ ▙▌
                </pre>

      <div class="line">
        <span class="prompt">$</span>
        <span class="cmd">status</span>
      </div>
      <div class="row status-row">
        <span class="out">remaining_time =</span>
        <span id="remaining" class="remaining">--:--:--</span>
      </div>
      <div class="row status-row">
        <span class="out">limiter =</span>
        <button id="enabledToggle" class="toggle-btn" type="button" aria-pressed="true">[ ON ]</button>
      </div>

      <div class="line">
        <span class="prompt">$</span>
        <span class="cmd">set-limit --minutes</span>
      </div>
      <div class="row">
        <span class="prompt-inline">&gt;</span>
        <input
          type="number"
          id="limitInput"
          min="1"
          max="300"
          step="1"
          inputmode="numeric"
          autocomplete="off"
        />
        <span class="cursor">_</span>
        <button id="saveBtn">save</button>
      </div>
      <div id="errorMsg" class="error-msg" hidden></div>

      <div class="line dim">
        <span class="prompt">$</span>
        <span class="cmd">presets</span>
      </div>
      <div class="presets" id="presets">
        <button class="preset" data-value="15">15m</button>
        <button class="preset" data-value="30">30m</button>
        <button class="preset" data-value="60">60m</button>
        <button class="preset" data-value="90">90m</button>
      </div>

      <div id="savedMsg" class="saved-msg" hidden>✔ saved</div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
